; Limites do PHP para envio de fotos (lidos por servidores com PHP-FPM/CGI, comum no cPanel).
; Se o painel do cPanel tiver "MultiPHP INI Editor", prefira ajustar por lá.
; 10 fotos de até 5 MB por envio precisam de post_max_size acima de 50 MB.
upload_max_filesize = 8M
post_max_size = 64M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120

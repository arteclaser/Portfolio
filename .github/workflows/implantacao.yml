# Publica o site na HostGator (cPanel) a cada atualização do branch "main",
# por FTP com criptografia (FTPS), sem precisar de SSH.
# Passo a passo de configuração: docs/IMPLANTACAO.md
name: Implantação na HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uma implantação por vez; uma nova espera a anterior terminar.
concurrency:
  group: implantacao-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implantar:
    name: Testar, montar e enviar
    runs-on: ubuntu-latest
    # A primeira implantação também apaga a pasta do aplicativo anterior, o que pode demorar.
    timeout-minutes: 90
    environment:
      name: producao
      url: ${{ vars.SITE_URL || 'https://mostraqui.net' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir os dados e rodar os testes unitários
        run: npm test

      - name: Montar o site
        run: npm run build

      - name: Instalar o cliente FTP (lftp, do Ubuntu)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Enviar por FTP e conferir o site publicado
        env:
          FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_SENHA: ${{ secrets.FTP_SENHA }}
          SITE_URL: ${{ vars.SITE_URL || 'https://mostraqui.net' }}
          FTP_PORTA: ${{ vars.FTP_PORTA || '21' }}
          FTP_CRIPTOGRAFIA: ${{ vars.FTP_CRIPTOGRAFIA || 'obrigatoria' }}
          FTP_CONFERIR_CERTIFICADO: ${{ vars.FTP_CONFERIR_CERTIFICADO || 'sim' }}
          # O FTP da HostGator apresenta o certificado *.hostgator.com.br (conferido em 09/10/2026).
          FTP_DOMINIO_CERTIFICADO: ${{ vars.FTP_DOMINIO_CERTIFICADO || 'hostgator.com.br' }}
          FTP_CONEXOES: ${{ vars.FTP_CONEXOES || '4' }}
          # Vazio: a implantação descobre sozinha a pasta pública de SITE_URL.
          PUBLIC_DIR: ${{ vars.PUBLIC_DIR }}
          # Pasta do aplicativo anterior (Laravel). Com "sim", ela é apagada depois que o site novo está no ar.
          APP_ANTIGO: ${{ vars.APP_DIR || 'mostraqui-app' }}
          REMOVER_APP_ANTIGO: ${{ vars.REMOVER_APP_ANTIGO || 'sim' }}
        run: bash deploy/implantar-ftp.sh

# Implantação automática na HostGator (cPanel) a cada atualização do branch "main",
# por FTP com criptografia (FTPS), sem precisar de SSH.
# Passo a passo de configuração: docs/IMPLANTACAO-AUTOMATICA.md
name: Implantação na HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uma implantação por vez; uma nova espera a anterior terminar.
concurrency:
  group: implantacao-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: dom, curl, gd, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo, intl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  implantar:
    name: Enviar para a HostGator
    needs: testes
    runs-on: ubuntu-latest
    # A primeira implantação envia todos os arquivos e pode demorar; as seguintes enviam só o que mudou.
    timeout-minutes: 180
    environment:
      name: producao
      url: ${{ vars.SITE_URL || 'https://mostraqui.net' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: dom, curl, gd, mbstring, zip, fileinfo, intl
          coverage: none

      - name: Instalar dependências de produção
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Instalar o cliente FTP (lftp, do Ubuntu)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Enviar por FTP e atualizar o banco
        env:
          FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_SENHA: ${{ secrets.FTP_SENHA }}
          SITE_URL: ${{ vars.SITE_URL }}
          FTP_PORTA: ${{ vars.FTP_PORTA || '21' }}
          FTP_CRIPTOGRAFIA: ${{ vars.FTP_CRIPTOGRAFIA || 'obrigatoria' }}
          FTP_CONFERIR_CERTIFICADO: ${{ vars.FTP_CONFERIR_CERTIFICADO || 'sim' }}
          FTP_CONEXOES: ${{ vars.FTP_CONEXOES || '4' }}
          APP_DIR: ${{ vars.APP_DIR || 'mostraqui-app' }}
          PUBLIC_DIR: ${{ vars.PUBLIC_DIR || 'public_html' }}
        run: bash deploy/implantar-ftp.sh

      - name: Conferir se o site responde
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL%/}/up" || true)
            [ "$code" = "200" ] && { echo "Site no ar (HTTP 200)."; exit 0; }
            sleep 5
          done
          echo "::error::O site não respondeu com HTTP 200 em ${SITE_URL%/}/up (último código: $code)."
          exit 1
